name: iOS build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & test (iPhone simulator)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          echo "Using simulator: $DEST"
          xcodebuild test \
            -project AbfindungApp.xcodeproj \
            -scheme AbfindungApp \
            -destination "platform=iOS Simulator,name=$DEST" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 25
      - name: Show errors
        if: failure()
        run: |
          grep -nE "error:|Testing failed|Failing tests|Test Case .* failed|XCTAssert" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-300 | head -60 || true
