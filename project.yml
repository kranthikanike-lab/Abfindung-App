name: AbfindungApp
options:
  bundleIdPrefix: de.abfindung
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "26.9"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  AbfindungApp:
    type: application
    platform: iOS
    sources: [AbfindungApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.abfindung.optimizer
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Abfindungs-Optimizer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AbfindungAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AbfindungAppTests]
    dependencies:
      - target: AbfindungApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AbfindungApp:
    build:
      targets:
        AbfindungApp: all
    test:
      targets: [AbfindungAppTests]
